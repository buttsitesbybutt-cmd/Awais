<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Projects — Awais Architect</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section style="padding-bottom:0;">
  <div class="wrap">
    <div class="eyebrow">Project Library</div>
    <h1 style="font-size:clamp(28px,4vw,44px);">Search the Full Project Library</h1>
    <p style="max-width:560px;">Filter by plot size, category, style, floors, bedrooms or file type to find the drawing set you need.</p>
  </div>
</section>

<section style="padding-top:26px;">
  <div class="wrap">
    <div class="filter-bar">
      <input type="text" id="f-search" placeholder="Search project name…">
      <select id="f-plot"><option value="">Plot Size — All</option></select>
      <select id="f-category"><option value="">Category — All</option></select>
      <select id="f-style"><option value="">Style — All</option></select>
      <select id="f-file"><option value="">File Type — All</option></select>
      <select id="f-floors">
        <option value="">Floors — All</option>
        <option value="1">1 Floor</option>
        <option value="2">2 Floors</option>
        <option value="3">3+ Floors</option>
      </select>
      <button class="chip" onclick="clearFilters()">Clear Filters</button>
    </div>
    <div id="results-meta" style="font-size:13px;color:var(--ink-soft);margin-bottom:18px;"></div>
    <div id="project-grid" class="project-grid"></div>
    <div id="no-results" class="center-empty" style="display:none;">
      <h3>No projects match those filters</h3>
      <p>Try clearing a filter or searching a different plot size or category.</p>
      <button class="btn btn-outline" onclick="clearFilters()">Clear Filters</button>
    </div>
    <div style="margin-top:36px;">
      <div id="ad-projects"></div>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>
<div id="floating-cta-slot"></div>
<div class="mobile-bottom-nav" id="mobile-bottom-nav"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
renderHeader("projects.html");
renderFooter();
renderFloatingCTA();
document.getElementById("ad-projects").innerHTML = adSlot("ADVERTISEMENT — Between Search Results","wide");

function fillSelect(id, values){
  const el = document.getElementById(id);
  values.forEach(v=> el.insertAdjacentHTML("beforeend", `<option value="${v}">${v}</option>`));
}
fillSelect("f-plot", FILTERS.plotSize);
fillSelect("f-category", FILTERS.category);
fillSelect("f-style", FILTERS.style);
fillSelect("f-file", FILTERS.fileType);

function projectCard(p){
  const priceHtml = p.price === 0 ? `<span class="pc-price free">Free</span>`
    : p.price === null ? `<span class="pc-price" style="font-size:13px;color:var(--ink-soft);">Portfolio Only</span>`
    : `<span class="pc-price">$${p.price.toFixed(2)}</span>`;
  return `
  <a href="project.html?slug=${p.slug}" class="project-card">
    <div class="pc-media">
      <span class="sheet-no">${p.id}</span>
      <span class="label-pill">${p.projectLabel}</span>
    </div>
    <div class="pc-body">
      <div class="pc-cat">${p.category} · ${p.plotSize}</div>
      <div class="pc-title">${p.title}</div>
      <p style="font-size:13.5px;margin:0;">${p.description}</p>
      <div class="pc-tags">${p.tags.slice(0,3).map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      <div class="pc-foot">
        ${priceHtml}
        <span class="btn btn-ghost btn-sm">View Project</span>
      </div>
    </div>
  </a>`;
}

function fileTypesOf(p){
  const s = new Set();
  p.drawings.forEach(d => d.types.forEach(t=>s.add(t)));
  if(p.gallery.some(g=>/render/i.test(g))) s.add("Render");
  if(p.gallery.some(g=>/animation/i.test(g))) s.add("Animation");
  return s;
}

function applyFilters(){
  const q = document.getElementById("f-search").value.toLowerCase();
  const plot = document.getElementById("f-plot").value;
  const cat = document.getElementById("f-category").value;
  const style = document.getElementById("f-style").value;
  const file = document.getElementById("f-file").value;
  const floors = document.getElementById("f-floors").value;

  const filtered = PROJECTS.filter(p=>{
    if(q && !p.title.toLowerCase().includes(q)) return false;
    if(plot && p.plotSize !== plot) return false;
    if(cat && p.category !== cat) return false;
    if(style && p.style !== style) return false;
    if(file && !fileTypesOf(p).has(file)) return false;
    if(floors){
      if(floors === "3" && !(p.floors >= 3)) return false;
      if(floors !== "3" && p.floors != floors) return false;
    }
    return true;
  });

  const grid = document.getElementById("project-grid");
  const empty = document.getElementById("no-results");
  document.getElementById("results-meta").textContent = `${filtered.length} project${filtered.length===1?"":"s"} found`;
  if(filtered.length === 0){
    grid.style.display = "none"; empty.style.display = "block";
  } else {
    grid.style.display = "grid"; empty.style.display = "none";
    grid.innerHTML = filtered.map(projectCard).join("");
  }
}

function clearFilters(){
  document.getElementById("f-search").value = "";
  ["f-plot","f-category","f-style","f-file","f-floors"].forEach(id=> document.getElementById(id).value = "");
  applyFilters();
}

["f-search","f-plot","f-category","f-style","f-file","f-floors"].forEach(id=>{
  document.getElementById(id).addEventListener("input", applyFilters);
  document.getElementById(id).addEventListener("change", applyFilters);
});

// Pre-fill from URL (category/style deep-links from homepage or nav)
const params = new URLSearchParams(location.search);
if(params.get("category")) document.getElementById("f-category").value = params.get("category");
applyFilters();
</script>
</body>
</html>
