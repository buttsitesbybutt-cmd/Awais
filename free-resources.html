<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Resources — Awais Architect</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section style="padding-bottom:0;">
  <div class="wrap">
    <div class="eyebrow">Free Architecture Resources</div>
    <h1 style="font-size:clamp(28px,4vw,44px);">Free House Plans, CAD Blocks & Templates</h1>
    <p style="max-width:560px;">A growing set of free downloads — no purchase required. Some pages include a short advertisement before the download.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div id="ad-free-top"></div>
    <div class="project-grid" id="free-grid" style="margin-top:26px;"></div>
    <div style="margin-top:30px;" id="ad-free-bottom"></div>
  </div>
</section>

<footer id="site-footer"></footer>
<div id="floating-cta-slot"></div>
<div class="mobile-bottom-nav" id="mobile-bottom-nav"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
renderHeader("free-resources.html");
renderFooter();
renderFloatingCTA();
document.getElementById("ad-free-top").innerHTML = adSlot("ADVERTISEMENT","wide");
document.getElementById("ad-free-bottom").innerHTML = adSlot("ADVERTISEMENT","wide");

const freeItems = PROJECTS.filter(p=>p.price===0);
const extraFree = [
  {title:"Free CAD Block Pack — Furniture", desc:"A starter set of furniture blocks for floor-plan layouts.", type:"DWG"},
  {title:"Free Door & Window Schedule Template", desc:"A blank, reusable schedule template.", type:"PDF"},
];

document.getElementById("free-grid").innerHTML = `
${freeItems.map(p=>`
  <div class="project-card">
    <div class="pc-media"><span class="sheet-no">${p.id}</span><span class="label-pill">Free</span></div>
    <div class="pc-body">
      <div class="pc-cat">${p.category}</div>
      <div class="pc-title">${p.title}</div>
      <p style="font-size:13.5px;">${p.description}</p>
      <button class="btn btn-primary btn-block" onclick="startFreeDownload('${p.slug}')">Download Free</button>
    </div>
  </div>
`).join("")}
${extraFree.map(f=>`
  <div class="project-card">
    <div class="pc-media"><span class="label-pill">Free</span></div>
    <div class="pc-body">
      <div class="pc-cat">${f.type}</div>
      <div class="pc-title">${f.title}</div>
      <p style="font-size:13.5px;">${f.desc}</p>
      <button class="btn btn-primary btn-block" onclick="showToast('Demo download started: ${f.title}')">Download Free</button>
    </div>
  </div>
`).join("")}
`;
</script>
</body>
</html>
